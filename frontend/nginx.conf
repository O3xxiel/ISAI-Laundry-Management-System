server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real (ej. /pos, /inventario) sirve
    # index.html y deja que React Router resuelva la navegación en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
